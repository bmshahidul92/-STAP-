<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শহীদুল টাইপিং অ্যাসেসমেন্ট পোর্টাল (STAP)</title>
    <link href="https://fonts.maateen.me/solaiman-lipi/font.css" rel="stylesheet">
    <style>
      @font-face {
          font-family: 'Nikosh';
          src: local('Nikosh'), local('NikoshBAN'), url('https://fonts.cdnfonts.com/s/72895/Nikosh.woff') format('woff');
          font-display: swap;
      }
      * { box-sizing: border-box; }
      body, html { margin: 0; padding: 0; font-family: 'Nikosh', 'SolaimanLipi', 'Times New Roman', serif; background: #f1f5f9; }
      .container { max-width: 95%; margin: 20px auto; }
      .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
      .hidden { display: none !important; }
      
      .brand-title { color: #1e3a8a; text-align: center; margin: 0; font-size: 26px; font-weight: bold; font-family: 'Nikosh', serif; }
      .brand-subtitle { color: #475569; text-align: center; margin: 4px 0 15px 0; font-size: 15px; font-weight: bold; font-family: 'Times New Roman', serif; }

      .exam-header { display: flex; justify-content: space-between; align-items: center; background: #e2e8f0; padding: 15px 20px; border-radius: 8px; font-size: 20px; font-weight: bold; margin-bottom: 20px; }
      
      .passage-box { font-size: 22px; line-height: 1.8; background: #f8fafc; border: 2px solid #cbd5e1; padding: 20px; border-radius: 8px; height: 180px; overflow-y: auto; margin-bottom: 20px; text-align: justify; user-select: none; }
      textarea.typing-area { width: 100%; height: 220px; font-size: 22px; line-height: 1.8; padding: 15px; border: 2px solid #94a3b8; border-radius: 8px; resize: none; outline: none; }
      textarea.typing-area:focus { border-color: #2563eb; box-shadow: 0 0 8px rgba(37,99,235,0.3); }

      .font-eng { font-family: 'Times New Roman', Times, serif !important; }
      .font-bn { font-family: 'Nikosh', 'SolaimanLipi', serif !important; }

      .btn-action { width: 100%; margin-top: 20px; padding: 15px; font-size: 20px; font-weight: bold; color: white; background: #2563eb; border: none; border-radius: 8px; cursor: pointer; }
      .btn-action:hover { background: #1d4ed8; }
      .form-group { margin-bottom: 15px; }
      .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 18px; }
      .form-group input { width: 100%; padding: 10px; font-size: 18px; border: 1px solid #ccc; border-radius: 5px; }
      .instruction-list { font-size: 18px; line-height: 1.8; margin-bottom: 20px; color: #334155; }
      
      /* নতুন রেজাল্ট টেবিল স্টাইল */
      .result-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
      .result-table th, .result-table td { border: 1px solid #cbd5e1; padding: 10px; text-align: center; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="container">
        <!-- ১. টাইপিং পরীক্ষা লগইন -->
        <div id="login-card" class="card" style="max-width: 500px; margin: 60px auto;">
            <h2 class="brand-title">শহীদুল টাইপিং অ্যাসেসমেন্ট পোর্টাল (STAP)</h2>
            <div class="brand-subtitle">Shahidul Typing Assessment Portal</div>
            <hr><br>
            <form onsubmit="event.preventDefault(); handleLogin();">
                <div class="form-group">
                    <label>মোবাইল নম্বর:</label>
                    <input type="text" id="candidate-id" class="font-eng" required placeholder="উদাহরণ: 01711223344">
                </div>
                <div class="form-group">
                    <label>পরীক্ষার্থীর নাম:</label>
                    <input type="text" id="candidate-name" class="font-bn" required placeholder="আপনার নাম লিখুন">
                </div>
                <div class="form-group">
                    <label>পরীক্ষা কোড (Exam Code):</label>
                    <input type="text" id="exam-code" class="font-eng" required placeholder="এডমিন কর্তৃক সরবরাহকৃত কোড">
                </div>
                <button type="submit" class="btn-action">প্রবেশ করুন</button>
            </form>
        </div>

        <!-- ২. নির্দেশনা স্ক্রিন -->
        <div id="instruction-card" class="card hidden" style="max-width: 800px; margin: 40px auto;">
            <h2 class="brand-title">নির্দেশাবলী</h2>
            <div class="instruction-list">
                <ul>
                    <li>প্রথমে ইংরেজি ও পরে বাংলা টাইপিং পরীক্ষা হবে।</li>
                    <li>নির্ধারিত সময়ের মধ্যে সম্পন্ন করতে হবে।</li>
                </ul>
            </div>
            <button onclick="startEnglishStep()" class="btn-action" style="background:#16a34a;">ইংরেজি টাইপ শুরু করুন</button>
        </div>

        <!-- ৩. ইংরেজি ও বাংলা টাইপিং স্ক্রিন (একই লজিক) -->
        <div id="exam-card" class="card hidden">
            <div class="exam-header">
                <div><strong id="lang-title">ইংরেজি</strong> পরীক্ষা</div>
                <div><strong>সময় বাকি:</strong> <span id="timer" class="font-eng" style="color:#dc2626;">05:00</span></div>
            </div>
            <div id="passage-box" class="passage-box"></div>
            <textarea id="typing-area" class="typing-area" spellcheck="false" autocomplete="off" placeholder="এখানে টাইপ করুন..."></textarea>
            <button id="btn-next" onclick="handleNextStep()" class="btn-action hidden">পরবর্তী ধাপ</button>
        </div>

        <!-- ৪. ফলাফল প্রদর্শন (জমার পর) -->
        <div id="success-card" class="card hidden" style="max-width: 800px; margin: 80px auto;">
            <h2 class="brand-title" style="color: #16a34a;">পরীক্ষা সফলভাবে জমা হয়েছে!</h2>
            <div id="result-summary"></div>
            <button onclick="window.location.reload();" class="btn-action">হোমে ফিরে যান</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let candidateId = "", candidateName = "", examCode = "", configData = {}, currentStep = 'eng';
        let timerInterval = null, timeLeft = 0;

        async function handleLogin() {
          candidateId = document.getElementById('candidate-id').value.trim();
          candidateName = document.getElementById('candidate-name').value.trim();
          examCode = document.getElementById('exam-code').value.trim();

          const res = await fetch('/api/validate-candidate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ candidateId, candidateName, examCode })
          });
          const data = await res.json();
          if (!data.success) { alert(data.message); return; }

          const cfgRes = await fetch('/api/exam-config');
          configData = await cfgRes.json();

          document.getElementById('login-card').classList.add('hidden');
          document.getElementById('instruction-card').classList.remove('hidden');
        }

        function startEnglishStep() {
            currentStep = 'eng';
            showExam(configData.engPassage, 'ইংরেজি');
        }

        function showExam(passage, title) {
            document.getElementById('instruction-card').classList.add('hidden');
            document.getElementById('exam-card').classList.remove('hidden');
            document.getElementById('lang-title').innerText = title;
            document.getElementById('passage-box').innerText = passage;
            document.getElementById('typing-area').value = "";
            document.getElementById('btn-next').classList.add('hidden');
            
            timeLeft = (parseInt(configData.duration) || 5) * 60;
            timerInterval = setInterval(() => {
                timeLeft--;
                let m = Math.floor(timeLeft / 60), s = timeLeft % 60;
                document.getElementById('timer').innerText = (m < 10 ? "0"+m : m) + ":" + (s < 10 ? "0"+s : s);
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('typing-area').disabled = true;
                    document.getElementById('btn-next').classList.remove('hidden');
                }
            }, 1000);
        }

        function handleNextStep() {
            if (currentStep === 'eng') {
                currentStep = 'bn';
                showExam(configData.bnPassage, 'বাংলা');
            } else {
                submitFinalExam();
            }
        }

        async function submitFinalExam() {
            // সার্ভার থেকে প্রাপ্ত রেজাল্ট অবজেক্টের ভিত্তিতে স্ট্রোকের কলামগুলো দেখানো
            const res = await fetch('/api/submit-exam', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ candidateId, candidateName, examCode })
            });
            const data = await res.json();
            
            const r = data.result;
            document.getElementById('exam-card').classList.add('hidden');
            document.getElementById('success-card').classList.remove('hidden');
            document.getElementById('result-summary').innerHTML = `
                <table class="result-table">
                    <tr><th>ভাষা</th><th>মোট স্ট্রোক</th><th>সঠিক স্ট্রোক</th><th>সঠিকতা (%)</th><th>ভুল স্ট্রোক</th><th>ভুল (%)</th></tr>
                    <tr><td>ইংরেজি</td><td>${r.english.totalWords}</td><td>${r.english.correctWords}</td><td>${r.english.accuracy}%</td><td>${r.english.errors}</td><td>${r.english.errorPercent}%</td></tr>
                    <tr><td>বাংলা</td><td>${r.bangla.totalWords}</td><td>${r.bangla.correctWords}</td><td>${r.bangla.accuracy}%</td><td>${r.bangla.errors}</td><td>${r.bangla.errorPercent}%</td></tr>
                </table>`;
        }
    </script>
</body>
</html>
